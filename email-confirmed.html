<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Confirm your email — Creations by Roma Apuyan</title>
<link rel="stylesheet" href="/assets/css/roma-app.css">
<style>
.confirm-outer{min-height:calc(100vh - 90px);padding:64px 16px;display:flex;align-items:center;justify-content:center}
.confirm-card{width:min(100%,540px);padding:36px 28px;text-align:center;background:linear-gradient(150deg,#2b1b2b,#150d17);border:1px solid #67405a;border-radius:20px;box-shadow:0 24px 65px #0006}
.confirm-logo{display:block;width:min(210px,70%);height:auto;margin:0 auto 18px}
.confirm-symbol{height:74px;width:74px;border-radius:50%;border:2px solid #e9b1c6;background:#422334;color:#f0c1d2;display:grid;place-items:center;margin:0 auto 22px;font-size:36px}
.confirm-card h1{font-size:clamp(32px,5vw,48px);margin:0 0 12px;color:#fff}
.confirm-card p{color:#e1cbd8;margin:0 auto 22px;max-width:390px}
.confirm-card small{color:#caaabe;display:block}
.confirm-card .roma-btn{min-width:200px;margin-top:12px}
</style>
<link rel="icon" href="/favicon.ico?v=20261009-11" sizes="any"><link rel="icon" href="/favicon-32.png?v=20261009-11" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261009-11"></head>
<body class="roma-app">
<header class="roma-top"><nav class="roma-top-inner" aria-label="Studio navigation"><a class="roma-logo brand" href="/" aria-label="Creations by Roma Apuyan — home"><span class="brand-mark" aria-hidden="true">RA</span><span class="brand-text">Creations by<br>Roma Apuyan</span></a><div class="roma-top-links"><a href="/">Home</a><a href="booking.html">Customer Dashboard</a></div></nav></header>
<main class="confirm-outer"><section class="confirm-card" aria-live="polite">
<img class="confirm-logo" src="/assets/img/ra-logo-email.png" alt="Creations by Roma Apuyan original RA logo">
<div class="confirm-symbol" id="confirm-symbol" aria-hidden="true">…</div>
<h1 id="confirm-heading">Confirming your email…</h1>
<p id="confirm-message">Open this page from your registration email, then confirm your account.</p>
<small id="confirm-hint">Creations by Roma Apuyan</small>
<div id="confirm-actions"><button class="roma-btn" type="button" id="confirm-button" hidden>Confirm My Email</button><a class="roma-btn secondary" id="login-link" href="/booking.html#login-form" hidden>Go to Sign In</a></div>
<form id="resend-form" hidden style="margin:20px auto 0;max-width:370px"><label class="roma-field" for="resend-email" style="text-align:left">Email address<input type="email" id="resend-email" autocomplete="email" required placeholder="you@example.com"></label><button type="submit" class="roma-btn secondary">Send a new confirmation email</button></form>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/roma-common.js"></script>
<script>
(() => {
  'use strict';
  const title=document.getElementById('confirm-heading');
  const msg=document.getElementById('confirm-message');
  const hint=document.getElementById('confirm-hint');
  const sym=document.getElementById('confirm-symbol');
  const button=document.getElementById('confirm-button');
  const login=document.getElementById('login-link');
  const resend=document.getElementById('resend-form');
  const query=new URLSearchParams(window.location.search);
  const hash=new URLSearchParams(window.location.hash.slice(1));
  const tokenHash=query.get('token_hash');
  const type=query.get('type');
  const error=query.get('error_description')||hash.get('error_description')||query.get('error')||hash.get('error');
  const client=window.Roma?.client;
  const loginUrl='/booking.html?email_confirmed=1#login-form';

  function fail(message){
    title.textContent='Confirmation link needs attention';
    msg.textContent=message;
    sym.textContent='!';
    hint.textContent='Enter your email below to request a fresh confirmation link, or sign in if you have already confirmed.';
    login.hidden=false;
    resend.hidden=false;
  }
  async function success(){
    // The customer should see a sign-in screen, not an automatically signed-in session.
    const {error:e}=await client.auth.signOut({scope:'local'});
    if(e)throw e;
    title.textContent='Your email is confirmed!';
    msg.textContent='Your Creations by Roma Apuyan account is ready. Redirecting you to sign in.';
    hint.textContent='Redirecting in 3 seconds…';
    sym.textContent='✓';
    button.hidden=true;
    resend.hidden=true;
    login.href=loginUrl;
    login.hidden=false;
    history.replaceState(null,'',window.location.pathname);
    window.setTimeout(()=>window.location.replace(loginUrl),3000);
  }

  if(error){fail(error);}
  else if(tokenHash && type==='email'){
    // Strip the one-time token from the visible address without discarding it from memory.
    history.replaceState(null,'',window.location.pathname);
    title.textContent='One final confirmation';
    msg.textContent='Click Confirm My Email to activate your account.';
    hint.textContent='This confirmation is done securely on our website.';
    sym.textContent='✉';
    button.hidden=false;
    button.addEventListener('click',async()=>{
      button.disabled=true;
      title.textContent='Confirming your email…';
      msg.textContent='Please wait a moment.';
      try{
        const {error:e}=await client.auth.verifyOtp({token_hash:tokenHash,type:'email'});
        if(e)throw e;
        await success();
      }catch(e){
        button.hidden=true;
        fail(e?.message||'This confirmation link may be expired. Request a new link.');
      }
    });
  } else if(hash.has('access_token') || query.has('code')){
    // Compatibility for older emails that used Supabase's direct confirmation link.
    title.textContent='Checking your confirmation…';
    (async()=>{
      try {
        if(query.has('code')){
          const {error:e}=await client.auth.exchangeCodeForSession(query.get('code'));
          if(e)throw e;
        }
        const {data,error:e}=await client.auth.getUser();
        if(e||!data.user?.email_confirmed_at)throw e||new Error('This link is no longer valid.');
        await success();
      }catch(e){fail(e?.message||'This confirmation link has expired.');}
    })();
  }else{
    fail('The confirmation link is missing or has expired. You can request a new email below.');
  }

  resend.addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const mail=document.getElementById('resend-email').value.trim();
    const btn=resend.querySelector('button');
    btn.disabled=true;
    try{
      const {error:e}=await client.auth.resend({type:'signup',email:mail,options:{emailRedirectTo:new URL('/email-confirmed.html',location.origin).href}});
      if(e)throw e;
      msg.textContent='If this account still needs confirmation, a new message will arrive shortly.';
      hint.textContent='Open the latest email and use its confirmation button.';
    }catch(e){msg.textContent=e?.message||'Unable to send a new confirmation email.';}
    finally{btn.disabled=false;}
  });
})();
</script>
</body>
</html>
